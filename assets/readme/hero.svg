<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="540" viewBox="0 0 1200 540"
     role="img" aria-labelledby="title desc">
  <title id="title">Ahmad Suyuti Syauqi — Fullstack &amp; Android Developer portfolio</title>
  <desc id="desc">Portfolio homepage: navigation bar, the name Ahmad Suyuti Syauqi, role Fullstack Developer, a short intro, Download CV and View work actions, social links, a framed portrait, and stats — 3+ years, 10+ projects, 7+ clients.</desc>

  <defs>
    <style>
      .mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
      .sans { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="0.42" stop-color="#e9e9e6"/>
      <stop offset="1" stop-color="#d7d7d2"/>
    </linearGradient>
    <clipPath id="photoClip"><rect x="864" y="150" width="272" height="272" rx="11"/></clipPath>
  </defs>

  <!-- Field: near-black, drawn not lit -->
  <rect width="1200" height="540" rx="20" fill="#0f0f0f"/>
  <rect x="0.5" y="0.5" width="1199" height="539" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>

  <!-- ── Nav (48px header, transparent) ───────────────────────── -->
  <g transform="translate(0 44)" class="mono">
    <text x="64" y="0" font-size="15" letter-spacing="3" fill="#f5f5f5">KII.</text>
    <g font-size="14" fill="#868586" text-anchor="middle">
      <text x="536" y="0" fill="#f5f5f5">Home</text>
      <text x="612" y="0">Services</text>
      <text x="686" y="0">About</text>
      <text x="746" y="0">Work</text>
      <text x="818" y="0">Contact</text>
    </g>
    <g transform="translate(1136 -18)">
      <rect x="-104" y="0" width="104" height="34" rx="9" fill="#ff5d6e"/>
      <text x="-52" y="22" font-size="13" fill="#fdfcf5" text-anchor="middle">Download CV</text>
    </g>
  </g>

  <!-- ── Title block ──────────────────────────────────────────── -->
  <g transform="translate(64 0)">
    <text class="mono" x="0" y="132" font-size="16" letter-spacing="4" fill="#868586">SURABAYA, INDONESIA</text>

    <text class="sans" x="-3" y="212" font-size="66" font-weight="600" letter-spacing="-2.4" fill="#f5f5f5">Ahmad Suyuti Syauqi</text>

    <text class="mono" x="0" y="256" font-size="17" fill="#868586">Fullstack Developer</text>
    <rect x="182" y="242" width="2" height="18" fill="#ff5d6e"/>

    <text class="sans" x="0" y="300" font-size="17" fill="#f5f5f5" fill-opacity="0.62">I build and test digital products end to end — from</text>
    <text class="sans" x="0" y="326" font-size="17" fill="#f5f5f5" fill-opacity="0.62">management information systems to hardware-integrated apps.</text>

    <!-- Actions -->
    <g transform="translate(0 360)">
      <rect x="0" y="0" width="176" height="40" rx="9" fill="#ff5d6e"/>
      <path d="M28 15 v11 M23 21 l5 5 l5 -5" fill="none" stroke="#fdfcf5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="sans" x="46" y="26" font-size="15" font-weight="500" fill="#fdfcf5">Download CV</text>

      <rect x="192" y="0" width="128" height="40" rx="9" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
      <text class="sans" x="256" y="26" font-size="15" font-weight="500" fill="#f5f5f5" text-anchor="middle">View work</text>
    </g>

    <!-- Socials -->
    <g transform="translate(0 446)" class="sans" font-size="14" fill="#f5f5f5" fill-opacity="0.62">
      <text x="0" y="0">GitHub</text><path d="M56 -10 l7 0 l0 7 M63 -10 l-9 9" stroke="#ff5d6e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <text x="86" y="0">LinkedIn</text><path d="M150 -10 l7 0 l0 7 M157 -10 l-9 9" stroke="#ff5d6e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <text x="180" y="0">Email</text><path d="M228 -10 l7 0 l0 7 M235 -10 l-9 9" stroke="#ff5d6e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ── Framed portrait (crop marks, no shadow) ──────────────── -->
  <g>
    <rect x="864" y="150" width="272" height="272" rx="11" fill="#141414" stroke="#ffffff" stroke-opacity="0.10"/>
    <g clip-path="url(#photoClip)">
      <rect x="864" y="150" width="272" height="272" fill="url(#wall)"/>
      <!-- head + shoulders silhouette, echoing the real portrait -->
      <circle cx="1000" cy="292" r="44" fill="#3b4a33"/>
      <path d="M916 422 q0 -74 84 -74 q84 0 84 74 z" fill="#3b4a33"/>
      <path d="M964 236 q36 -30 72 0 q6 22 -6 40 q-30 -26 -60 0 q-12 -18 -6 -40 z" fill="#1f2a1a"/>
    </g>
    <!-- crop marks -->
    <g stroke="#ffffff" stroke-opacity="0.28">
      <path d="M852 150 h12 M858 144 v12"/>
      <path d="M1148 150 h-12 M1142 144 v12"/>
      <path d="M852 422 h12 M858 416 v12"/>
      <path d="M1148 422 h-12 M1142 416 v12"/>
    </g>
  </g>

  <!-- ── Stats bar (dashed rules top &amp; bottom) ─────────────────── -->
  <g transform="translate(64 0)">
    <line x1="0" y1="470" x2="1072" y2="470" stroke="#ffffff" stroke-opacity="0.14" stroke-dasharray="1 0"/>
    <g class="mono" font-size="13" letter-spacing="2" fill="#868586">
      <text x="0" y="500">YEARS</text>
      <text x="360" y="500">PROJECTS</text>
      <text x="720" y="500">CLIENTS</text>
    </g>
    <g class="sans" font-size="34" font-weight="500" letter-spacing="-1" fill="#f5f5f5">
      <text x="0" y="524">3+</text>
      <text x="360" y="524">10+</text>
      <text x="720" y="524">7+</text>
    </g>
  </g>
</svg>
