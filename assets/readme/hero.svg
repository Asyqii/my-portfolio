<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">Ahmad Suyuti Syauqi — Fullstack &amp; Android Developer portfolio</title>
  <desc id="desc">Portfolio homepage source. Fullstack and Android developer and QA enthusiast based in Surabaya, Indonesia, built with React, Vite, TypeScript and Tailwind CSS.</desc>

  <defs>
    <style>
      .mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
      .sans { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5d6e" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#88db8b" stop-opacity="0.10"/>
    </linearGradient>
    <clipPath id="cardClip"><rect x="724" y="70" width="404" height="232" rx="10"/></clipPath>
  </defs>

  <!-- Field: near-black, drawn not lit -->
  <rect width="1200" height="360" rx="20" fill="#0f0f0f"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>

  <!-- Dashed margin rails, the site's drafting motif -->
  <line x1="56" y1="28" x2="56" y2="332" stroke="#ffffff" stroke-opacity="0.16" stroke-dasharray="6 8"/>
  <line x1="1144" y1="28" x2="1144" y2="332" stroke="#ffffff" stroke-opacity="0.16" stroke-dasharray="6 8"/>

  <!-- Title block -->
  <g transform="translate(96 84)">
    <!-- Eyebrow: mono, uppercase, positive tracking, muted -->
    <text class="mono" x="0" y="0" font-size="17" letter-spacing="4" fill="#868586">SURABAYA, INDONESIA</text>

    <!-- Name: display, tight negative tracking, weight 500 -->
    <text class="sans" x="-2" y="66" font-size="62" font-weight="600" letter-spacing="-2" fill="#f5f5f5">Ahmad Suyuti</text>
    <text class="sans" x="-2" y="130" font-size="62" font-weight="600" letter-spacing="-2" fill="#f5f5f5">Syauqi</text>

    <!-- Role line with the coral caret cue -->
    <text class="mono" x="0" y="176" font-size="19" fill="#868586">Fullstack<tspan fill="#5c5c5c"> · </tspan>Android<tspan fill="#5c5c5c"> · </tspan>QA</text>
    <rect x="232" y="162" width="2" height="19" fill="#ff5d6e"/>

    <!-- Tech chips -->
    <g transform="translate(0 206)" class="mono" font-size="15" fill="#d4d4d4">
      <g>
        <rect x="0" y="-16" width="70" height="26" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
        <text x="14" y="2">React</text>
      </g>
      <g transform="translate(80 0)">
        <rect x="0" y="-16" width="88" height="26" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
        <text x="14" y="2">Next.js</text>
      </g>
      <g transform="translate(178 0)">
        <rect x="0" y="-16" width="98" height="26" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
        <text x="14" y="2">TypeScript</text>
      </g>
      <g transform="translate(286 0)">
        <rect x="0" y="-16" width="72" height="26" rx="6" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
        <text x="14" y="2">Kotlin</text>
      </g>
    </g>
  </g>

  <!-- Proof: a simplified browser frame of the live portfolio -->
  <g>
    <rect x="724" y="70" width="404" height="232" rx="10" fill="#141414" stroke="#ffffff" stroke-opacity="0.10"/>
    <!-- Browser chrome -->
    <path d="M724 80 a10 10 0 0 1 10 -10 h384 a10 10 0 0 1 10 10 v22 h-404 z" fill="#1b1b1b"/>
    <circle cx="742" cy="86" r="3.5" fill="#ff5d6e"/>
    <circle cx="756" cy="86" r="3.5" fill="#4d4d4d"/>
    <circle cx="770" cy="86" r="3.5" fill="#4d4d4d"/>
    <rect x="788" y="79" width="300" height="14" rx="7" fill="#0f0f0f"/>
    <text class="mono" x="800" y="90" font-size="10" fill="#868586">ahmad-suyuti-portfolio.vercel.app</text>

    <!-- Screen content -->
    <g clip-path="url(#cardClip)">
      <rect x="724" y="102" width="404" height="200" fill="url(#screen)"/>
      <text class="sans" x="748" y="150" font-size="30" font-weight="600" letter-spacing="-1" fill="#f5f5f5">Selected work</text>
      <text class="mono" x="748" y="176" font-size="11" fill="#868586">10+ PROJECTS · 7+ CLIENTS · 3+ YEARS</text>
      <!-- mini project cards -->
      <rect x="748" y="196" width="112" height="72" rx="7" fill="#141414" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="872" y="196" width="112" height="72" rx="7" fill="#141414" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="996" y="196" width="112" height="72" rx="7" fill="#141414" stroke="#ffffff" stroke-opacity="0.10"/>
      <rect x="756" y="204" width="96" height="40" rx="4" fill="#ff5d6e" fill-opacity="0.18"/>
      <rect x="880" y="204" width="96" height="40" rx="4" fill="#88db8b" fill-opacity="0.14"/>
      <rect x="1004" y="204" width="96" height="40" rx="4" fill="#ffffff" fill-opacity="0.06"/>
    </g>

    <!-- Crop marks pinning the frame corners -->
    <g stroke="#ffffff" stroke-opacity="0.24">
      <path d="M712 70 h10 M717 65 v10"/>
      <path d="M1140 70 h-10 M1135 65 v10"/>
      <path d="M712 302 h10 M717 297 v10"/>
      <path d="M1140 302 h-10 M1135 297 v10"/>
    </g>
  </g>

  <!-- Footer metadata rule -->
  <line x1="96" y1="322" x2="1104" y2="322" stroke="#ffffff" stroke-opacity="0.10" stroke-dasharray="6 8"/>
  <text class="mono" x="96" y="342" font-size="13" fill="#5c5c5c">PORTFOLIO · SOURCE</text>
  <text class="mono" x="1104" y="342" font-size="13" text-anchor="end" fill="#5c5c5c">REACT · VITE · TAILWIND</text>
</svg>
