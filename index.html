    <!-- Structured data: helps search engines identify the person behind the site. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Ahmad Suyuti Syauqi",
        "url": "https://ahmad-suyuti-portfolio.vercel.app/",
        "jobTitle": "Fullstack & Android Developer",
        "image": "https://ahmad-suyuti-portfolio.vercel.app/og-image.jpg",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Surabaya",
          "addressCountry": "ID"
        },
        "knowsAbout": ["React", "Next.js", "Kotlin", "Android Development", "Software Testing", "QA"],
        "sameAs": [
          "https://github.com/Asyqii",
          "https://www.linkedin.com/in/ahmadsuyutisyauqi/"
        ]
      }
    </script>


    <script>
      // Resolve the theme before first paint so the field never flashes.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark = stored
            ? stored === "dark"
            : !window.matchMedia("(prefers-color-scheme: light)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
